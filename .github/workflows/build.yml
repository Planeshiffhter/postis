---
name: Build

on:
  push:
    branches:
      - main
  merge_group:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'

    strategy:
      matrix:
        node-version: ['22.23.4']

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check standalone configuration formatting
        run: pnpm exec prettier --check package.json README.md docker-compose.local.yml eslint.config.mjs '.github/workflows/*.{yaml,yml}'

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postiz
        run: pnpm exec prisma validate --schema libraries/nestjs-libraries/src/database/prisma/schema.prisma

      - name: Build and type-check
        env:
          MAIN_URL: http://localhost:4200
          FRONTEND_URL: http://localhost:4200
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3000
          IS_GENERAL: 'true'
        run: pnpm run build
